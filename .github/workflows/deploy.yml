name: Déploiement S3 + CloudFront

on:
  push:
    branches:
      - claude/finances-territoires-redesign-hq8nfc
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  S3_BUCKET: site-finances-territoires

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Le contenu publié depuis l'admin (data/*.json) fait foi : on le récupère
      # avant de régénérer les pages pour ne pas l'écraser avec la version du dépôt.
      - name: Récupérer le contenu publié depuis l'admin
        run: aws s3 cp "s3://${S3_BUCKET}/data/" data/ --recursive --exclude "*" --include "*.json"

      - name: Régénérer les pages statiques
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-pages.mjs

      # Les photos téléversées depuis l'admin n'existent que dans S3 : pas de --delete sur images/.
      - name: Synchroniser vers S3
        run: |
          aws s3 sync . "s3://${S3_BUCKET}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "images/*"
          aws s3 sync images "s3://${S3_BUCKET}/images"

      - name: Invalider le cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Autoriser l'admin (CORS du bucket)
        run: |
          aws s3api put-bucket-cors --bucket "${S3_BUCKET}" --cors-configuration '{
            "CORSRules": [{
              "AllowedOrigins": ["https://site.id.finances-territoires.fr", "https://skurzhansky.github.io"],
              "AllowedMethods": ["GET", "HEAD", "PUT", "POST", "DELETE"],
              "AllowedHeaders": ["*"],
              "ExposeHeaders": ["ETag"],
              "MaxAgeSeconds": 3600
            }]
          }'
