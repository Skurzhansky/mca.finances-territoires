name: Déploiement S3 + CloudFront

on:
  push:
    branches:
      - claude/finances-territoires-redesign-hq8nfc
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3
  S3_BUCKET: site-finances-territoires

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Régénérer les pages statiques
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-pages.mjs

      - name: Configurer les identifiants AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synchroniser vers S3
        run: |
          aws s3 sync . "s3://${S3_BUCKET}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Invalider le cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
